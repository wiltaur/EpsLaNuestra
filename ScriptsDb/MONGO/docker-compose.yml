version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: eps_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: eps_la_nuestra_bd
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: